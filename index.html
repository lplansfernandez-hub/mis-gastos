<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis gastos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: una columna para iPhone. Balance del año arriba, 12 meses en cuadrícula, calendario del mes elegido, hoja inferior al tocar un día. Sin fuentes externas para que funcione sin internet. */
:root{
  --font-display:ui-rounded,"SF Pro Rounded","Avenir Next",-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#EEF0F4; --surface:#FFFFFF; --surface2:#E3E7EE; --ink:#12161F; --ink2:#566073; --line:#D5DAE3;
  --accent:#2F55D4; --accent-ink:#FFFFFF;
  --pos:#1B7F46; --pos-bg:#DCEFE3; --neg:#C2352B; --neg-bg:#F6E0DD; --scrim:rgba(18,22,31,.45);
  --c1:#E2672C; --c2:#D99A00; --c3:#3F6FD8; --c4:#8A5CC7; --c5:#D64F86; --c8:#7D8A99;
  --p1:#1B7F46; --p2:#1C93A8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1117; --surface:#171B24; --surface2:#222835; --ink:#E8ECF4; --ink2:#98A2B5; --line:#2B3342;
    --accent:#8FA8FF; --accent-ink:#0B1233;
    --pos:#52C27F; --pos-bg:#16301F; --neg:#F0766C; --neg-bg:#3A1F1D; --scrim:rgba(0,0,0,.6);
    --c1:#F0925A; --c2:#E5B04A; --c3:#7C9CF0; --c4:#B08CE6; --c5:#EE7FAB; --c8:#9AA6B8;
    --p1:#52C27F; --p2:#4FC3D6;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 120px);-webkit-text-size-adjust:100%}
main{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
main.loading .card{opacity:.55}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border-radius:20px;padding:18px;transition:opacity .2s}
.label{font:500 12px/1 var(--font-num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px}
.top h1{margin:0;font:500 13px/1 var(--font-num);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.topr{display:flex;align-items:center;gap:4px}
.nav{display:flex;align-items:center;gap:2px}
.nav .name{min-width:5.5ch;text-align:center;font:700 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;font-size:24px;color:var(--ink)}
.iconbtn:active{background:var(--surface2)}
.textbtn{height:44px;padding:0 12px;border:0;border-radius:22px;background:var(--surface2);font:600 14px/1 var(--font-body)}
.banners{display:flex;flex-direction:column;gap:10px}
.banner{background:var(--surface2);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.banner button{flex:0 0 auto;height:36px;padding:0 14px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font:600 14px/1 var(--font-body)}

.yearcard{display:flex;flex-direction:column;gap:16px}
.balance{font:700 52px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;flex-wrap:wrap;margin-top:8px}
.balance .dec{font-size:26px;font-weight:500;opacity:.7}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trio>div{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.trio .v{font:500 18px/1 var(--font-num);font-variant-numeric:tabular-nums}

.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 12px 10px;border-radius:14px;border:2px solid transparent;background:var(--surface);min-width:0}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.tile .m{font:500 12px/1 var(--font-num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.tile .n{font:500 14px/1.1 var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .bars{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.tile .b{height:5px;border-radius:3px;min-width:0}
.tile .b.i{background:var(--pos)} .tile .b.e{background:var(--neg)}

.mhead{margin-bottom:14px}
.balance.small{font-size:38px;margin-top:8px}
.balance.small .dec{font-size:20px}
.trio.mtrio{grid-template-columns:1fr 1fr;padding-bottom:16px}
.trio.mtrio .v{font-size:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px 4px}
.calhead .name{font:700 20px/1 var(--font-display)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font:500 11px/1 var(--font-num);color:var(--ink2);text-align:center;padding:4px 0 6px}
.cell{aspect-ratio:1/1.12;min-width:0;border:0;border-radius:10px;background:var(--surface2);padding:5px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.cell.blank{background:transparent;pointer-events:none}
.cell.has-pos{background:var(--pos-bg)} .cell.has-neg{background:var(--neg-bg)}
.cell .d{font:500 14px/1 var(--font-body)}
.cell .a{font:500 11px/1 var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.today .d{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:600;margin-top:-3px}
.cell:active{filter:brightness(.95)}

.scope{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:16px}
.scope button{height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--ink2)}
.scope button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.legend li{display:grid;grid-template-columns:12px 1fr auto 44px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.dot{width:12px;height:12px;border-radius:4px}
.legend .amt,.legend .pct{font-family:var(--font-num);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.legend .pct{color:var(--ink2)}
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);margin:12px 0 6px}
.stack div{min-width:3px;height:100%}
.sect{display:flex;flex-direction:column;gap:6px}
.sect+.sect{margin-top:18px}
.emptynote{color:var(--ink2);font-size:15px;margin:0}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;height:56px;padding-inline:26px;border:0;border-radius:28px;background:var(--accent);color:var(--accent-ink);font:600 17px/1 var(--font-body);box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px}
.fab:active{transform:translateX(-50%) scale(.97)}
.fab .plus{font-size:24px;line-height:1;margin-top:-2px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin-inline:auto;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px}
.sheet[hidden],.scrim[hidden],.toast[hidden],[hidden]{display:none!important}
.sheet:not([hidden]){animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet:not([hidden]),.card{animation:none;transition:none}}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-right:-10px}
.sheethead h2{margin:0;font:700 20px/1.2 var(--font-display)}
.daylist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.drow:first-child{border-top:0}
.drow .nm{display:flex;flex-direction:column;min-width:0}
.drow .cat{font-weight:500}
.drow .note{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .mny{font:500 15px/1 var(--font-num);font-variant-numeric:tabular-nums}
.dayfoot{display:flex;justify-content:space-between;padding:10px 0 2px;border-top:1px solid var(--line);font:500 13px/1 var(--font-num);color:var(--ink2)}
.dayfoot b{font-weight:500}
form{display:flex;flex-direction:column;gap:14px;margin:0;padding-top:14px;border-top:2px solid var(--line)}
.type{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type label{position:relative}
.type input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.type span{display:grid;place-items:center;height:46px;border-radius:12px;background:var(--surface2);font-weight:600;border:2px solid transparent}
.type input[value="gasto"]:checked + span{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
.type input[value="ingreso"]:checked + span{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.amountbox{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:6px}
.amountbox:focus-within{border-color:var(--accent)}
.amountbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 40px/1.1 var(--font-display);font-variant-numeric:tabular-nums;padding:0;outline:none}
.amountbox input::placeholder{color:var(--ink2);opacity:.5}
.amountbox .eur{font:500 26px/1 var(--font-display);color:var(--ink2)}
.errmsg{color:var(--neg);font-size:14px;margin-top:-6px}
fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span.t{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface2);font-weight:500;font-size:15px;border:2px solid transparent}
.chip input:checked + span.t{border-color:var(--ink);background:var(--surface)}
.hint{font-size:13px;color:var(--ink2);margin-top:-2px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:48px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--ink);font:400 16px/1 var(--font-body);min-width:0;width:100%}
.field input:focus{border-color:var(--accent);outline:none}
.actions{display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:14px;border:0;font:600 16px/1 var(--font-body)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.6}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--neg);border:2px solid var(--neg);flex:0 0 auto;padding-inline:18px}
.databody{display:flex;flex-direction:column;gap:14px}
.databody .stackbtns{display:flex;flex-direction:column;gap:10px}
.datanote{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:20;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>

<main id="app" class="loading">
  <header class="top">
    <h1>Mis gastos</h1>
    <div class="topr">
      <div class="nav">
        <button class="iconbtn" id="yprev" type="button" aria-label="Año anterior">&#8249;</button>
        <span class="name" id="yearLabel" aria-live="polite"></span>
        <button class="iconbtn" id="ynext" type="button" aria-label="Año siguiente">&#8250;</button>
      </div>
      <button class="textbtn" id="dataBtn" type="button">Datos</button>
    </div>
  </header>
  <div class="banners" id="banners"></div>
  <section class="card yearcard" id="yearCard" aria-label="Balance del año"></section>
  <section aria-label="Meses del año"><div class="months" id="months"></div></section>
  <section class="card" id="calCard" aria-label="Calendario del mes"></section>
  <section class="card" id="breakdown" aria-label="Resumen por categoría"></section>
</main>

<button class="fab" id="fab" type="button"><span class="plus" aria-hidden="true">+</span>Añadir hoy</button>
<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheethead">
    <h2 id="sheetTitle"></h2>
    <button class="iconbtn" id="closeX" type="button" aria-label="Cerrar">&#215;</button>
  </div>
  <div id="dayList"></div>
  <form id="form" autocomplete="off" novalidate>
    <div class="label" id="formMode">Nuevo movimiento</div>
    <div class="type" role="radiogroup" aria-label="Tipo de movimiento">
      <label><input type="radio" name="type" value="gasto" checked><span>Gasto</span></label>
      <label><input type="radio" name="type" value="ingreso"><span>Ingreso</span></label>
    </div>
    <div>
      <label class="label" for="amount">Importe</label>
      <div class="amountbox">
        <input id="amount" type="text" inputmode="decimal" placeholder="0,00" aria-describedby="amountErr">
        <span class="eur" aria-hidden="true">€</span>
      </div>
    </div>
    <div class="errmsg" id="amountErr" role="alert" hidden>Escribe un importe mayor que 0.</div>
    <fieldset>
      <legend class="label">Categoría</legend>
      <div class="chips" id="chips"></div>
      <div class="hint" id="hint" hidden></div>
    </fieldset>
    <label class="field"><span class="label">Nota</span><input id="note" type="text" maxlength="80" placeholder="Opcional"></label>
    <div class="actions">
      <button class="btn danger" id="del" type="button" hidden>Eliminar</button>
      <button class="btn ghost" id="cancel" type="button">Cerrar</button>
      <button class="btn primary" id="save" type="submit">Guardar</button>
    </div>
  </form>
</div>

<div class="sheet" id="dataSheet" role="dialog" aria-modal="true" aria-labelledby="dataTitle" hidden>
  <div class="sheethead">
    <h2 id="dataTitle">Datos y copia de seguridad</h2>
    <button class="iconbtn" id="dataClose" type="button" aria-label="Cerrar">&#215;</button>
  </div>
  <div class="databody" id="dataBody"></div>
  <input type="file" id="fileInput" accept=".json,.csv,.txt,application/json,text/csv,text/plain" hidden>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
/*PURE-START*/
var MINUS="−";
function pad(n){return String(n).padStart(2,"0");}
function r2(n){return Math.round(n*100)/100;}
function stripAcc(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

/* Número en formato español o inglés: 1.234,56 · 1,234.56 · -12,5 · (12,50) · €12 */
function parseNumber(v){
  var raw=String(v==null?"":v).trim();
  var neg=/^-/.test(raw)||/-$/.test(raw)||/^\(.*\)$/.test(raw)||/^[^\d]*-\s*\d/.test(raw);
  var s=raw.replace(/[^\d.,]/g,"");
  if(!s)return NaN;
  var lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){
    if(lc>ld)s=s.replace(/\./g,"").replace(",",".");
    else s=s.replace(/,/g,"");
  }else if(lc>-1){
    s=(s.match(/,/g)||[]).length>1?s.replace(/,/g,""):s.replace(",",".");
  }else if(ld>-1){
    var cnt=(s.match(/\./g)||[]).length,after=s.length-ld-1;
    if(cnt>1||after===3)s=s.replace(/\./g,"");
  }
  var n=parseFloat(s);
  if(!isFinite(n))return NaN;
  return neg?-n:n;
}
function mkDate(y,mo,d){
  if(mo<1||mo>12||d<1||d>31||y<1900||y>2200)return null;
  var dt=new Date(y,mo-1,d);
  if(dt.getMonth()!==mo-1)return null;
  return y+"-"+pad(mo)+"-"+pad(d);
}
/* Fechas: 2026-10-13 · 13/10/2026 · 13-10-26 · 13.10.2026 (día/mes si es ambiguo) */
function parseDate(v){
  var s=String(v==null?"":v).trim(),m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return mkDate(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){
    var y=+m[3];if(y<100)y+=2000;
    var a=+m[1],b=+m[2];
    if(b>12&&a<=12)return mkDate(y,a,b);
    return mkDate(y,b,a);
  }
  return null;
}
function parseCSV(text){
  text=String(text).replace(/^﻿/,"");
  var first=text.split(/\r?\n/).filter(function(l){return l.trim();})[0]||"";
  var delim=",",best=-1;
  [";",",","\t","|"].forEach(function(c){var n=first.split(c).length;if(n>best){best=n;delim=c;}});
  var rows=[],row=[],cur="",q=false;
  function endRow(){
    row.push(cur);cur="";
    if(row.some(function(c){return c.trim();}))rows.push(row);
    row=[];
  }
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=ch;
    }else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;endRow();}
    else cur+=ch;
  }
  if(cur!==""||row.length)endRow();
  return rows;
}
var COLNAMES={
  date:["fecha","date","dia","day","data"],
  amount:["importe","amount","cantidad","monto","total","valor","value","precio","price","sum"],
  type:["tipo","type","movimiento"],
  cat:["categoria","category","cat","grupo"],
  note:["nota","notas","note","notes","descripcion","description","concepto","detalle","memo","titulo","title","comentario"],
  income:["ingreso","ingresos","income","entrada","entradas"],
  expense:["gasto","gastos","expense","expenses","salida","salidas"]
};
function findCol(headers,names){
  var i;
  for(i=0;i<headers.length;i++)if(names.indexOf(headers[i])>-1)return i;
  for(i=0;i<headers.length;i++)for(var j=0;j<names.length;j++)if(headers[i].indexOf(names[j])===0)return i;
  return -1;
}
function mapCategory(type,catText,noteText){
  var t=stripAcc((catText||"")+" "+(noteText||""));
  if(type==="ingreso")return /deposit|ahorro|saving|interes|interest/.test(t)?"deposito":"trabajo";
  if(/invers|invest|\bbolsa\b|broker|crypto|cripto|\bfondos?\b|\bacciones\b|\betf\b|bitcoin/.test(t))return "inversiones";
  if(/comida|food|restaur|super|grocer|cafe|\bbar\b|alimenta|dining|mercadona|lidl|panader|burger|pizza|bebida|\bmenu\b/.test(t))return "comida";
  if(/transport|gasolin|fuel|taxi|\bbus\b|metro|\btren\b|train|parking|moto|coche|\bcar\b|peaje|uber|vuelo|flight|diesel|petrol|\bitv\b/.test(t))return "transporte";
  if(/\bhome\b|\bcasa\b|hogar|alquiler|\brent\b|suscrip|subscr|internet|\bluz\b|\bagua\b|electric|autonom|gestor|seguro|insurance|factura|\bbills?\b|hipoteca|mortgage|netflix|spotify|movil|phone|impuesto|\btax\b/.test(t))return "home";
  if(/compra|shop|ropa|cloth|amazon|regalo|gift|electron/.test(t))return "compras";

function cleanItem(x,fixedId){

  var date=/^\d{4}-\d{2}-\d{2}$/.test(String(x.date))?String(x.date):null;
  var amount=r2(Math.abs(+x.amount));
  if(!date||!(amount>0))return null;
  var list=type==="ingreso"?INCCATS:EXPCATS;
  var cat=list.indexOf(x.cat)>-1?x.cat:mapCategory(type,x.cat,x.note);
  return {id:fixedId||genId(),type:type,amount:amount,cat:cat,note:String(x.note||"").slice(0,80),date:date,ts:+x.ts||Date.now()};
}
function parseImportText(text,fileName){
  var out={items:[],skipped:0,kind:"",decision:"",error:""};
  var t=String(text).replace(/^﻿/,"").trim();
  if(!t){out.error="El archivo está vacío.";return out;}
  if(t[0]==="{"||t[0]==="["){
    var obj;
    try{obj=JSON.parse(t);}catch(e){out.error="No puedo leer este archivo JSON.";return out;}
    var arr=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.items)?obj.items:null);
    if(!arr){out.error="Este JSON no tiene movimientos.";return out;}
    out.kind="copia";
    arr.forEach(function(x){
      var it=x&&typeof x==="object"?cleanItem(x,typeof x.id==="string"&&x.id?x.id:null):null;
      if(it)out.items.push(it);else out.skipped++;
    });
    return out;
  }
  var rows=parseCSV(t);
  if(rows.length<2){out.error="No encuentro filas de datos en el archivo.";return out;}
  var hd=rows[0].map(stripAcc);
  var ci={};
  Object.keys(COLNAMES).forEach(function(k){ci[k]=findCol(hd,COLNAMES[k]);});
  var hasSplit=ci.income>-1||ci.expense>-1;
  if(ci.date<0||(ci.amount<0&&!hasSplit)){
    out.error="No reconozco las columnas. Hacen falta al menos una de fecha y una de importe.";return out;
  }
  out.kind="csv";
  var raw=[],pos=0,neg=0;
  rows.slice(1).forEach(function(r){
    var date=parseDate(r[ci.date]);
    if(!date){out.skipped++;return;}
    var rec={date:date,cat:ci.cat>-1?r[ci.cat]:"",note:ci.note>-1?r[ci.note]:"",type:null,amt:NaN};
    if(hasSplit){
      var inc=ci.income>-1?Math.abs(parseNumber(r[ci.income])):NaN;
      var exp=ci.expense>-1?Math.abs(parseNumber(r[ci.expense])):NaN;
      if(inc>0){rec.type="ingreso";rec.amt=inc;}
      else if(exp>0){rec.type="gasto";rec.amt=exp;}
    }else{
      var a=parseNumber(r[ci.amount]);
      if(isFinite(a)&&a!==0){
        rec.amt=a;
        var tt=ci.type>-1?stripAcc(r[ci.type]):"";
        if(/ingreso|income|deposit|salary|nomina|entrada|cobro/.test(tt))rec.type="ingreso";
        else if(/gasto|expense|egreso|salida|pago|payment|withdraw|retirada/.test(tt))rec.type="gasto";
        if(a>0)pos++;else neg++;
      }
    }
    if(!isFinite(rec.amt)||rec.amt===0){out.skipped++;return;}
    raw.push(rec);
  });
  var mixed=pos>0&&neg>0;
  out.decision=hasSplit?"Columnas separadas de ingresos y gastos.":(ci.type>-1?"Tipo según la columna de tipo.":(mixed?"Importes negativos como gastos y positivos como ingresos.":"Todos los importes se han tomado como gastos."));
  raw.forEach(function(rec,i){
    var type=rec.type;
    if(!type)type=mixed&&rec.amt>0?"ingreso":"gasto";
    var note=String(rec.note||"").trim()||String(rec.cat||"").trim();
    var it=cleanItem({type:type,amount:Math.abs(rec.amt),cat:mapCategory(type,rec.cat,rec.note),note:note,date:rec.date,ts:Date.now()+i},genId()+i.toString(36));
    if(it)out.items.push(it);else out.skipped++;
  });
  return out;
}

  $("#dataClose").addEventListener("click",closeSheets);
  scrim.addEventListener("click",closeSheets);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!scrim.hidden)closeSheets();});

  $("#form").addEventListener("submit",function(e){
    e.preventDefault();
    var amt=parseAmount($("#amount").value);
    if(!(amt>0)){$("#amountErr").hidden=false;$("#amount").focus();return;}
    $("#amountErr").hidden=true;
    var item={id:state.editing?state.editing.id:genId(),type:state.type,amount:amt,cat:selectedCat(),note:$("#note").value.trim(),date:state.sheetDate,ts:state.editing&&state.editing.ts?state.editing.ts:Date.now()};
    var wasEdit=!!state.editing;
    var btn=$("#save");btn.disabled=true;
    state.store.save(item).then(function(){
      upsertLocal(item);resetForm(null);refresh();
      toast(wasEdit?"Cambios guardados":(item.type==="ingreso"?"Ingreso guardado":"Gasto guardado"));
    }).catch(function(){btn.disabled=false;toast("No se pudo guardar. Inténtalo otra vez.");});
  });
  $("#del").addEventListener("click",function(){
    if(!state.editing)return;
    if(!state.confirmDel){state.confirmDel=true;this.textContent="¿Seguro?";return;}
    var id=state.editing.id;
    state.store.remove(id).then(function(){
      state.all=state.all.filter(function(x){return x.id!==id;});resetForm(null);refresh();toast("Movimiento eliminado");
    }).catch(function(){toast("No se pudo eliminar. Inténtalo otra vez.");});
  });

  $("#yprev").addEventListener("click",function(){setView(state.year-1,state.month);});
  $("#ynext").addEventListener("click",function(){setView(state.year+1,state.month);});

  /* ---------- Datos: copia de seguridad e importación ---------- */
  function saveFile(name,mime,text){
    var blob=new Blob([text],{type:mime});
    var file=null;
    try{file=new File([blob],name,{type:mime});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(function(){return true;},function(err){
        if(err&&err.name==="AbortError")return false;
        return anchorSave(blob,name);
      });
    }
    return Promise.resolve(anchorSave(blob,name));
  }
  function anchorSave(blob,name){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.append(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    return true;
  }
  function exportJSON(){
    var payload={app:"mis-gastos",version:1,exportedAt:new Date().toISOString(),items:state.all.map(function(x){return {id:x.id,type:x.type,amount:x.amount,cat:x.cat,note:x.note||"",date:x.date,ts:x.ts||0};})};
    saveFile("mis-gastos-"+ymd(new Date())+".json","application/json",JSON.stringify(payload,null,1)).then(function(ok){
      if(!ok)return;
      state.lastBackup=Date.now();state.store.setMeta("lastBackup",state.lastBackup);
      renderBanners();renderData();toast("Copia lista. Guárdala en Archivos.");
    });
  }
  function exportCSV(){
    var rows=["fecha;tipo;categoria;importe;nota"];
    state.all.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0);}).forEach(function(x){
      var note='"'+String(x.note||"").replace(/"/g,'""')+'"';
      rows.push([x.date,x.type,CAT[x.cat]?CAT[x.cat].name:x.cat,String(x.amount).replace(".",","),note].join(";"));
    });
    saveFile("mis-gastos-"+ymd(new Date())+".csv","text/csv","﻿"+rows.join("\r\n")).then(function(ok){if(ok)toast("CSV listo");});
  }
  function readFile(file){
    if(file.text)return file.text();
    return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsText(file);});
  }
  $("#fileInput").addEventListener("change",function(){
    var f=this.files&&this.files[0];this.value="";
    if(!f)return;
    readFile(f).then(function(text){
      state.preview=parseImportText(text,f.name);state.preview.fileName=f.name;renderData();
    }).catch(function(){state.preview={items:[],skipped:0,error:"No he podido leer el archivo.",fileName:f.name};renderData();});
  });
  function doImport(){
    var items=state.preview.items;
    state.store.saveMany(items).then(function(){return state.store.load();}).then(function(list){
      state.all=list.map(norm);state.preview=null;
      var y=items.reduce(function(m,x){return x.date>m?x.date:m;},"");
      if(y){state.year=+y.slice(0,4);state.month=+y.slice(5,7)-1;}
      refresh();renderData();toast("Importados "+items.length+" movimientos");
    }).catch(function(){toast("No se pudo importar. Inténtalo otra vez.");});
  }
  function renderData(){
    var box=$("#dataBody");box.textContent="";
    var p=state.preview;
    if(p){
      if(p.error){
        box.append(h("div",{class:"datanote"},p.error),
          h("div",{class:"actions"},h("button",{class:"btn ghost",type:"button",onclick:function(){state.preview=null;renderData();}},"Volver"),h("button",{class:"btn primary",type:"button",onclick:function(){$("#fileInput").click();}},"Elegir otro")));
        return;
      }
      var g=p.items.filter(function(x){return x.type==="gasto";}).length,i=p.items.length-g;
      box.append(
        h("div",{class:"datanote"},
          h("strong",null,p.items.length+" movimientos"),
          " leídos de "+(p.fileName||"el archivo")+": "+g+" gastos y "+i+" ingresos."+(p.skipped?" "+p.skipped+" filas ignoradas.":""),
          p.decision?h("div",{style:"margin-top:6px"},p.decision):null,
          p.kind==="csv"?h("div",{style:"margin-top:6px"},"Las categorías se asignan por palabras clave; la categoría original queda en la nota. Si importas el mismo archivo dos veces, se duplican."):null),
        h("div",{class:"actions"},
          h("button",{class:"btn ghost",type:"button",onclick:function(){state.preview=null;renderData();}},"Cancelar"),
          h("button",{class:"btn primary",type:"button",disabled:!p.items.length,onclick:doImport},"Importar")));
      return;
    }
    var last=state.lastBackup?new Date(state.lastBackup).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}):"ninguna";
    box.append(
      h("p",{class:"emptynote"},"Tus movimientos se guardan solo en este iPhone y la app funciona sin internet. Guarda una copia de vez en cuando en Archivos (iCloud Drive)."),
      h("div",{class:"datanote"},state.all.length+" movimientos guardados · Última copia: "+last),
      h("div",{class:"stackbtns"},
        h("button",{class:"btn primary",type:"button",onclick:exportJSON},"Guardar copia de seguridad"),
        h("button",{class:"btn ghost",type:"button",onclick:function(){$("#fileInput").click();}},"Importar copia o CSV"),
        h("button",{class:"btn ghost",type:"button",onclick:exportCSV},"Exportar a CSV (Excel)")));
  }
  function openData(){
    state.preview=null;renderData();
    sheet.hidden=true;scrim.hidden=false;dataSheet.hidden=false;dataSheet.scrollTop=0;
  }
  $("#dataBtn").addEventListener("click",openData);

  /* ---------- Arranque ---------- */
  buildChips("gasto",null);
  render();
  makeIdbStore().catch(function(){return makeMemoryStore();}).then(function(store){
    state.store=store;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
    return Promise.all([store.load(),store.getMeta("lastBackup"),store.getMeta("hideInstall")]);
  }).then(function(r){
    state.all=(r[0]||[]).map(norm);
    state.lastBackup=+r[1]||0;state.hideInstall=!!r[2];
    state.ready=true;refresh();
  }).catch(function(){
    state.store=makeMemoryStore();state.ready=true;refresh();
  });
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
  }
})();
</script>
</body>
</html>
